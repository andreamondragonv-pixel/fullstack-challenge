name: CI/CD STG Pipeline

on: 
  pull_request:
    branches:
      - stage
      - bugfix/* 
    path:
      app/*

jobs:
  build:
    runs-on: ubuntu-latest
    environment: stg

    steps: 
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '16'

      - name: Install dependencies
        run: |
          cd app
          npm install

      - name: Run linter
        run: |
          cd app
          npm run lint

      - name: Run formatter
        run: |
          cd app
          npm run prettier

      - name: Run tests
        env: 
          CI: true
        run: |
          cd app
          npm run test

      - name: Build project
        run: |
          cd app
          npm run build

      - name: Persist Build 
        uses: actions/upload-artifact@v4
        with:
          name: Build
          path: ./app/build

  deploy:
    runs-on: ubuntu-latest
    environment: stg
    needs: build
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '16'

      - name: Install dependencies
        run: |
         cd app
         npm install

      - name: Restore Build 
        uses: actions/download-artifact@v4
        with:
          name: Build
          path: ./app
      
      - name: Debloy S3
        uses: reggionick/s3-deploy@v4
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        with:
          folder: ./app/build
          bucket: ${{ secrets.S3_BUCKET }}
          bucket-region: us-east-1

