name: CI/CD DEV Pipeline

on:
  pull_request:
    branches:
      - devel
    paths:
      - app/**
      - .github/workflows/ci-dev.yml
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        ref: ${{ github.head_ref || github.ref_name }}
        fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 15.14.0
      - name: Set up npm
        working-directory: ./app
        run: npm install -g npm@7
      - name: Install dependencies
        working-directory: ./app
        run: npm install
      - name: Run linter
        working-directory: ./app
        run: npm run lint
      - name: Run formatter
        working-directory: ./app
        run: npm run prettier
      - name: Run tests
        working-directory: ./app
        env:
          CI: true
        run: npm run test
      - name: Build project
        working-directory: ./app
        run: npm run build
      - name: Persist Build
        uses: actions/upload-artifact@v4
        with:
          name: Build
          path: ./app/build