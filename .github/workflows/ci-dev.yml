name: CD DEV Pipeline

on:
  push:
    branches:
      - devel

permissions:
  contents: read
  actions: read
  pull-requests: read
  id-token: write

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Deploy to S3
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Find CI Build Run
        id: find-build
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            const runs = await github.rest.actions.listWorkflowRuns({
              repo: context.repo.repo,
              workflow_id: "ci-dev.yml",
              head_sha: pr.head.sha,
              event: "pull_request",
              status: "success"
            });

            const matchingRun = runs.data.workflow_runs
              .filter(run =>
                run.pull_requests?.some(item => item.number === pr.number)
              )
              .sort((a, b) =>
                new Date(b.created_at) - new Date(a.created_at)
              )[0];

            if (!matchingRun) {
              core.setFailed(
                `No successful CI build found for PR #${pr.number} and commit ${pr.head.sha}`
              );
              return;
            }

            core.setOutput("run_id", String(matchingRun.id));

      - name: Download Build
        uses: actions/download-artifact@v4
        with:
          name: Build
          path: ./app/build
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.find-build.outputs.run_id }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_APPLY }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Dev-Pipeline

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Deploy S3
        uses: reggionick/s3-deploy@v4
        with:
          folder: ./app/build
          bucket: ${{ secrets.S3_BUCKET }}
          bucket-region: ${{ env.AWS_REGION }}