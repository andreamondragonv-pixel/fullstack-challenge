name: Terraform CI/CD - Dev

on:
  pull_request:
    branches:
      - devel
    paths:
      - "terraform/**"
      - ".github/workflows/tf-ci-cd-dev.yml"

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_PATH: terraform
  TF_VERSION: "1.16.6"

jobs:

  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format
        working-directory: ${{ env.TF_PATH }}
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ${{ env.TF_PATH }}
        run: terraform  init -backend=false -input=false

      - name: Terraform Validate
        working-directory: ${{ env.TF_PATH }}
        run: terraform validate

  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: validate
    environment: dev
    if: github.event_name == 'pull' && github.ref == 'refs/heads/devel'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_PLAN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Terraform-Plan

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Terraform Init
        working-directory: ${{ env.TF_PATH }}
        run: |
          terraform init \
            -input=false \
            -backend-config="bucket=gomo-terraform" \
            -backend-config="key=tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true"

      - name: Terraform Plan
        working-directory: ${{ env.TF_PATH }}
        run: |
          terraform plan \
            -input=false \
            -var-file=dev.tfvars \
            -out=tfplan

      - name: Show Terraform Plan
        working-directory: ${{ env.TF_PATH }}
        run: terraform show tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform/tfplan
          retention-days: 1