name: CI/CD DEV Pipeline

on:
  push:
    branches:
      - devel
      - feature/*
    paths:
      - app/**
      - .github/workflows/ci-cd-dev.yml
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 15.14.0
      - name: Set up npm
        working-directory: ./app
        run: npm install -g npm@7
      - name: Install dependencies
        working-directory: ./app
        run: npm install
      - name: Run linter
        working-directory: ./app
        run: npm run lint
      - name: Run formatter
        working-directory: ./app
        run: npm run prettier
      - name: Run tests
        working-directory: ./app
        env:
          CI: true
        run: npm run test
      - name: Build project
        working-directory: ./app
        run: npm run build
      - name: Persist Build
        uses: actions/upload-artifact@v4
        with:
          name: Build
          path: ./app/build
          retention-days: 1


  deploy:
    name: Deploy to S3
    needs: build
    runs-on: ubuntu-latest
    environment: dev

    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write

    steps:
      - name: Download Build
        uses: actions/download-artifact@v4
        with:
          name: Build
          path: ./app/build

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_APPLY }}
          aws-region: us-east-1
          role-session-name: GitHubActions-Dev-Pipeline

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Deploy to S3
        run: |
          aws s3 sync ./app/build \
            s3://${{ secrets.S3_BUCKET }} \
            --delete

      - name: Invalidate CloudFront Cache
        env:
          DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"